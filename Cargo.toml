[package]
name = "optik"
version = "0.1.0"
edition = "2021"
authors = ["Anton Feldmann <anton.feldmann@-ai.de>"]
license = "Apache-2.0"
description = "High-performance RPi camera manager with Rust core and Python bindings"
readme = "README.md"

[lib]
name = "optik"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21" }
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
memmap2 = "0.9"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"
ndarray = "0.16"
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tempfile = "3.8"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
